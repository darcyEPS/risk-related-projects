name: Build and Deploy Shinylive

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually for testing

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install shinylive shiny
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Site
        run: |
          shinylive export . site
          # Custom Favicon and Title injection
          cp graphics/favicon.svg site/favicon.svg || true
          sed -i 's/<title>Shiny App<\/title>/<title>Risk-Related Projects<\/title>/g' site/index.html
          sed -i 's/<\/head>/<link rel="icon" type="image\/svg+xml" href="favicon.svg"><\/head>/' site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4